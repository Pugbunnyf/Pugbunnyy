<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="CScorpo">
    <header class="CScabecalho">
        <div class="CSareaTopo">
            <img class="CSamongTopo" src="./assets/among-17.png" alt="">
            <div class="CSinformacoes">
                <div class="CScontador">
                    <p class="CStextoTentativas">TENTATIVAS</p>
                    <p class="CSnumeroTentativas"><span class="CStentativaAtual">0</span><span class="CStentativaTotal">/6</span></p>
                </div>
                <p class="CSinstrucao">Adivinhe a palavra secreta de 5 letras.</p>
            </div>
        </div>
        <button class="CSbotaoReiniciar"></button>
    </header>

    <main class="CSprincipal">
        <div class="CSjogo">
            <input class="CScampoPalavra" type="text" maxlength="5" placeholder="Acerte a senha">
            <button class="CSbotaoEnviar">ENVIAR</button>
            <p class="CSmensagem"></p>
            <div class="CStabuleiro">
                <div class="CSlinha">

                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                </div>

                <div class="CSlinha">
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                </div>

                <div class="CSlinha">
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                </div>

                <div class="CSlinha">
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                </div>

                <div class="CSlinha">
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                </div>

                <div class="CSlinha">
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                    <div class="CSquadrado"></div>
                </div>
            </div>
        </div>
    </main>

    <div class="CStelaResultado CSescondido">
        <button
            class="CSbotaoFechar"></button>
        <div class="CSconteudoResultado">
            <h1 class="CStituloResultado">Vitória</h1>
            <img class="CSamongResultado" src="./assets/among-17.png" alt="">
        </div>
    </div>

    <script src="./script.js"></script>

</body>
</html>
